[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimodel-modular-rag"
version = "0.1.0"
description = "A modular RAG subsystem for the AImodel shopping agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "jieba>=0.42.1,<1.0",
    "langchain-text-splitters>=0.3,<1.0",
    "markitdown[pdf]>=0.1,<1.0",
    "mcp>=1.0,<2.0",
    "openai>=1.0,<3.0",
    "pgvector>=0.3,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pymupdf>=1.24,<2.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "python-json-logger>=3.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "streamlit>=1.40,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "pytest-mock>=3.14,<4.0",
    "ragas>=0.2,<1.0",
    "ruff>=0.11,<1.0",
]
evaluation = [
    "datasets>=3.0,<5.0",
    "ragas>=0.2,<1.0",
]
rerank = [
    "sentence-transformers>=3.0,<6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast tests without external services",
    "integration: tests that may require PostgreSQL or local infrastructure",
    "e2e: end-to-end workflow tests",
    "external: tests that call real model or external service APIs",
]
filterwarnings = [
    "ignore:invalid escape sequence.*:SyntaxWarning:jieba.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "W"]
