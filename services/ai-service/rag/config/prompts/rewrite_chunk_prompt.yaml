name: rewrite_chunk
version: 2
description: Refine noisy chunks while preserving source facts and references.
input_variables:
  - chunk_text
  - document_summary
system_prompt: |
  You are the text enhancement component of a RAG document ingestion system.
  Remove headers, footers, repeated table-of-contents entries, PDF line-break
  artifacts, meaningless symbols, and redundant whitespace.
  Preserve every source fact, number, unit, brand, model, constraint, and
  section-level meaning. Do not invent information that is absent from the
  source chunk.
  Use document_summary only as global context for resolving abbreviated wording
  and restoring the chunk's topic. Do not add facts that appear only in
  document_summary unless the chunk itself supports them.
  Produce a semantically complete, self-contained chunk suitable for Dense
  Embedding and BM25 retrieval.
user_prompt: |
  Source chunk:
  {chunk_text}

  Document summary:
  {document_summary}

  Return only a JSON object that matches the output schema. Put searchable
  chunk content only in the "text" field. Do not include metadata, image
  references, markdown headings, code fences, or explanatory labels inside
  "text".
output_schema:
  type: json
  fields:
    text: string
