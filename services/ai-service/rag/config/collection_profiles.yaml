version: "1.0"
profiles:
  shopping_guides:
    description: 商品选购指南、品牌型号对比、参数解释、购买建议、场景化推荐。
    examples:
      - 空调怎么选
      - 微波炉哪个品牌适合家用
      - 儿童安全座椅看哪些参数
      - 防晒霜哪款适合通勤

  faq:
    description: 商品使用问题、故障排查、常见疑问、报错解释和使用限制。
    examples:
      - 微波炉不加热怎么办
      - 洗衣机显示 E2 是什么意思
      - 扫地机器人为什么回不了基站
      - 空气炸锅有异味怎么处理

  policies:
    description: 平台规则、售后、物流、退款、发票、会员积分、账号安全和企业采购政策。
    examples:
      - 退货运费谁承担
      - 发票怎么开
      - 拒收商品后怎么处理
      - 会员积分什么时候到账

  manual:
    description: 客服话术、投诉处理、催发货、催退款、缺货替代、价格保护解释和物流异常安抚。
    examples:
      - 用户催退款怎么回复
      - 客户投诉发货慢怎么安抚
      - 缺货时怎么推荐替代商品
      - 物流异常应该怎么解释
