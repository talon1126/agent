name: Agent task gate

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: Taskbook task ID, for example G1
        required: true
        type: string
      quality_report:
        description: Repository-relative quality report for F5/G5/H5/I5
        required: false
        type: string
  workflow_call:
    inputs:
      task_id:
        required: true
        type: string
      quality_report:
        required: false
        type: string

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate pipeline configuration
        run: python scripts/task_preflight.py --check-config

      - name: Run two-layer task audit
        run: python scripts/task_audit.py --task "${{ inputs.task_id }}" --target-ref HEAD

      - name: Verify selected task
        shell: pwsh
        env:
          AGENT_VERIFIER_ID: github-actions
        run: |
          $arguments = @("scripts/task_verify.py", "--task", "${{ inputs.task_id }}")
          if ("${{ inputs.quality_report }}") {
            $arguments += @("--quality-report", "${{ inputs.quality_report }}")
          }
          python @arguments

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-task-${{ inputs.task_id }}-evidence
          path: artifacts/task-evidence/${{ inputs.task_id }}/
          if-no-files-found: error
