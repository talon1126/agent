name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service test dependencies
        run: |
          python -m pip install uv

      - name: Run tests
        run: |
          python scripts/task_preflight.py --check-config
          uv run --project services/ai-service pytest tests -v
          uv run --project services/ai-service pytest services/ai-service/tests -v
          uv run --project services/mock-api pytest services/mock-api/tests -v
          uv run --project services/feishu-adapter pytest services/feishu-adapter/tests -v

      - name: Validate Docker Compose
        run: docker compose config --quiet
