name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install service test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/ai-service[test]"
          python -m pip install -e "services/mock-api[test]"
          python -m pip install -e "services/feishu-adapter[test]"

      - name: Run tests
        run: |
          pytest services/ai-service/tests -v
          pytest services/mock-api/tests -v
          pytest services/feishu-adapter/tests -v
          pytest tests/test_department_workflows.py -v
          pytest tests/test_chat_parent_son_workflow.py -v

      - name: Validate Docker Compose
        run: docker compose config --quiet
