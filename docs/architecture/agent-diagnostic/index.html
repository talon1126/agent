(()=>{

function renderZoom(){panels[current].style.width=`${zoom*100}%`;value.value=zoom===1?'适宽':`${Math.round(zoom*100)}%`;document.getElementById('zoom-out').disabled=zoom<=1;document.getElementById('zoom-in').disabled=zoom>=6}
