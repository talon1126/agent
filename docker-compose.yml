services:
  postgres:
    build:
      context: ./services/postgres
    command: ["postgres", "-c", "shared_preload_libraries=pg_search"]
    environment:
      POSTGRES_DB: agent_ops
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./services/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_ops"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ai-service:
    build:
      context: ./services/ai-service
    environment:
      AI_MODE: fake
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.6plus}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      AIMODEL_MODEL: ${AIMODEL_MODEL:-deepseek-v4-flash}
      RAG_PROJECT_DIR: /app/rag
      RAG_MCP_COMMAND: python
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:5173}
      POLICY_PATH: /app/fixtures/policies/after_sales_policy.md
      MOCK_API_URL: http://mock-api:8000
      DATABASE_URL: postgresql://agent:agent@postgres:5432/agent_ops
      TRANSCRIPTION_PROVIDER: mock
      TRANSCRIPTION_MODEL: qwen3.6plus
    volumes:
      - ./fixtures:/app/fixtures:ro
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  mock-api:
    build:
      context: ./services/mock-api
    environment:
      DATABASE_URL: postgresql+psycopg://agent:agent@postgres:5432/agent_ops
      FIXTURE_DIR: /app/fixtures
      REDIS_URL: redis://redis:6379/0
      FEISHU_FULFILLMENT_REVIEW_NOTIFY_URL: ${FEISHU_FULFILLMENT_REVIEW_NOTIFY_URL:-http://feishu-adapter:8000/warehouse/order-fulfillment-review/send}
      FEISHU_FULFILLMENT_REVIEW_CHAT_ID: ${FEISHU_FULFILLMENT_REVIEW_CHAT_ID:-}
      FEISHU_PURCHASE_ARRIVAL_NOTIFY_URL: ${FEISHU_PURCHASE_ARRIVAL_NOTIFY_URL:-http://feishu-adapter:8000/warehouse/purchase-arrival-review/send}
      FEISHU_PURCHASE_ARRIVAL_NOTIFY_CHAT_ID: ${FEISHU_PURCHASE_ARRIVAL_NOTIFY_CHAT_ID:-}
    volumes:
      - ./fixtures:/app/fixtures:ro
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  feishu-adapter:
    build:
      context: ./services/feishu-adapter
    environment:
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-http://n8n:5678/webhook/chat-agent-inbound}
      FEISHU_BOTS_JSON: ${FEISHU_BOTS_JSON:-}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_API_BASE_URL: ${FEISHU_API_BASE_URL:-https://open.feishu.cn}
      FEISHU_EVENT_MODE: ${FEISHU_EVENT_MODE:-long_connection}
      FEISHU_ADAPTER_HTTP_TIMEOUT_SECONDS: ${FEISHU_ADAPTER_HTTP_TIMEOUT_SECONDS:-180}
      FEISHU_RUN_LOG_URL: ${FEISHU_RUN_LOG_URL:-http://mock-api:8000/run-logs}
      FEISHU_FULFILLMENT_REVIEW_CHAT_ID: ${FEISHU_FULFILLMENT_REVIEW_CHAT_ID:-}
      FEISHU_PURCHASE_ARRIVAL_NOTIFY_CHAT_ID: ${FEISHU_PURCHASE_ARRIVAL_NOTIFY_CHAT_ID:-}
      MOCK_API_URL: http://mock-api:8000
      FEISHU_INVENTORY_TABLE_APP_ID: ${FEISHU_INVENTORY_TABLE_APP_ID:-}
      FEISHU_INVENTORY_TABLE_APP_SECRET: ${FEISHU_INVENTORY_TABLE_APP_SECRET:-}
      FEISHU_INVENTORY_TABLE_APP_TOKEN: ${FEISHU_INVENTORY_TABLE_APP_TOKEN:-}
      FEISHU_INVENTORY_TABLE_ID: ${FEISHU_INVENTORY_TABLE_ID:-}
      FEISHU_INVENTORY_TABLE_VIEW_ID: ${FEISHU_INVENTORY_TABLE_VIEW_ID:-}
      FEISHU_INVENTORY_TABLE_URL: ${FEISHU_INVENTORY_TABLE_URL:-}
      FEISHU_INVENTORY_BALANCE_TABLE_ID: ${FEISHU_INVENTORY_BALANCE_TABLE_ID:-}
      FEISHU_INVENTORY_BALANCE_TABLE_VIEW_ID: ${FEISHU_INVENTORY_BALANCE_TABLE_VIEW_ID:-}
      FEISHU_INVENTORY_BALANCE_TABLE_URL: ${FEISHU_INVENTORY_BALANCE_TABLE_URL:-}
      FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_ID: ${FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_ID:-}
      FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_VIEW_ID: ${FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_VIEW_ID:-}
      FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_URL: ${FEISHU_PROCUREMENT_REPLENISHMENT_REQUEST_TABLE_URL:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_ID: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_ID:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_VIEW_ID: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_VIEW_ID:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_URL: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_TABLE_URL:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_ID: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_ID:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_VIEW_ID: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_VIEW_ID:-}
      FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_URL: ${FEISHU_PROCUREMENT_PURCHASE_ORDER_DRAFT_TABLE_URL:-}
      FEISHU_ORDER_FULFILLMENT_TABLE_ID: ${FEISHU_ORDER_FULFILLMENT_TABLE_ID:-}
      FEISHU_ORDER_FULFILLMENT_TABLE_VIEW_ID: ${FEISHU_ORDER_FULFILLMENT_TABLE_VIEW_ID:-}
      FEISHU_ORDER_FULFILLMENT_TABLE_URL: ${FEISHU_ORDER_FULFILLMENT_TABLE_URL:-}
      FEISHU_ORDER_ITEMS_TABLE_ID: ${FEISHU_ORDER_ITEMS_TABLE_ID:-}
      FEISHU_ORDER_ITEMS_TABLE_VIEW_ID: ${FEISHU_ORDER_ITEMS_TABLE_VIEW_ID:-}
      FEISHU_ORDER_ITEMS_TABLE_URL: ${FEISHU_ORDER_ITEMS_TABLE_URL:-}
      FEISHU_ITEMS_TABLE_ID: ${FEISHU_ITEMS_TABLE_ID:-}
      FEISHU_ITEMS_TABLE_VIEW_ID: ${FEISHU_ITEMS_TABLE_VIEW_ID:-}
      FEISHU_ITEMS_TABLE_URL: ${FEISHU_ITEMS_TABLE_URL:-}
      FEISHU_PRODUCT_OPERATIONS_TABLE_ID: ${FEISHU_PRODUCT_OPERATIONS_TABLE_ID:-}
      FEISHU_PRODUCT_OPERATIONS_TABLE_VIEW_ID: ${FEISHU_PRODUCT_OPERATIONS_TABLE_VIEW_ID:-}
      FEISHU_PRODUCT_OPERATIONS_TABLE_URL: ${FEISHU_PRODUCT_OPERATIONS_TABLE_URL:-}
      FEISHU_FLASH_SALES_TABLE_ID: ${FEISHU_FLASH_SALES_TABLE_ID:-}
      FEISHU_FLASH_SALES_TABLE_VIEW_ID: ${FEISHU_FLASH_SALES_TABLE_VIEW_ID:-}
      FEISHU_FLASH_SALES_TABLE_URL: ${FEISHU_FLASH_SALES_TABLE_URL:-}
      FEISHU_FLASH_SALE_CLAIMS_TABLE_ID: ${FEISHU_FLASH_SALE_CLAIMS_TABLE_ID:-}
      FEISHU_FLASH_SALE_CLAIMS_TABLE_VIEW_ID: ${FEISHU_FLASH_SALE_CLAIMS_TABLE_VIEW_ID:-}
      FEISHU_FLASH_SALE_CLAIMS_TABLE_URL: ${FEISHU_FLASH_SALE_CLAIMS_TABLE_URL:-}
      FEISHU_TABLE_STATE_PATH: ${FEISHU_TABLE_STATE_PATH:-/app/state/feishu_table_state.json}
      FEISHU_IMAGE_TOKEN_CACHE_PATH: ${FEISHU_IMAGE_TOKEN_CACHE_PATH:-/app/state/feishu_image_token_cache.json}
      ALIYUN_OSS_ACCESS_KEY_ID: ${ALIYUN_OSS_ACCESS_KEY_ID:-}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${ALIYUN_OSS_ACCESS_KEY_SECRET:-}
      ALIYUN_OSS_ENDPOINT: ${ALIYUN_OSS_ENDPOINT:-}
      ALIYUN_OSS_BUCKET: ${ALIYUN_OSS_BUCKET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
    ports:
      - "8010:8000"
    volumes:
      - feishu_table_state:/app/state
    depends_on:
      - n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:stable
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      AI_SERVICE_URL: http://ai-service:8000
      MOCK_API_URL: http://mock-api:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-qwen3.6plus}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      - ai-service
      - mock-api

volumes:
  postgres_data:
  n8n_data:
  feishu_table_state:
