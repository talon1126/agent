    "M1-02": {"target": "Complete shopping tasks", "denominator": "all frozen M1 scenarios", "window": "frozen_run", "applicable_milestones": ["D"], "checks": [{"field": "task_success_rate", "operator": "gte", "threshold": 0.8}]},
